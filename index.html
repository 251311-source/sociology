<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="업로드한 PDF·PPT 자료 범위 안에서만 공부하는 사회학 학습 프로그램">
<title>사회학 학습</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root {
  color-scheme: light;
  --bg: #f6f5f1;
  --surface: #ffffff;
  --surface-2: #f0efea;
  --line: #e2e0d8;
  --ink: #1f2026;
  --ink-2: #4a4c57;
  --muted: #6e7080;
  --accent: #2a5bc4;
  --accent-ink: #ffffff;
  --accent-soft: #e6edfb;
  --right: #1b7f4b;
  --right-soft: #e3f4ea;
  --wrong: #c23b3b;
  --wrong-soft: #fbe7e6;
  --partial: #a26a00;
  --partial-soft: #fbf0d9;
  --flag: #b0549a;
  --flag-soft: #f8e4f2;
  --k-soc: #2a78d6;
  --k-theory: #eb6834;
  --k-concept: #1baf7a;
  --shadow: 0 1px 2px rgba(20, 20, 40, .06), 0 4px 14px rgba(20, 20, 40, .05);
  --radius: 12px;
  --top-h: 108px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #15161a; --surface: #1e1f25; --surface-2: #26272e; --line: #34353d;
    --ink: #ecebe6; --ink-2: #c6c5bd; --muted: #9a9aa3;
    --accent: #7aa2f2; --accent-ink: #10131a; --accent-soft: #243150;
    --right: #5cc98c; --right-soft: #1c3428; --wrong: #f07b7b; --wrong-soft: #3d2222;
    --partial: #e3b04f; --partial-soft: #3a2f17; --flag: #e08ccc; --flag-soft: #3a2236;
    --k-soc: #3987e5; --k-theory: #d95926; --k-concept: #199e70;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #15161a; --surface: #1e1f25; --surface-2: #26272e; --line: #34353d;
  --ink: #ecebe6; --ink-2: #c6c5bd; --muted: #9a9aa3;
  --accent: #7aa2f2; --accent-ink: #10131a; --accent-soft: #243150;
  --right: #5cc98c; --right-soft: #1c3428; --wrong: #f07b7b; --wrong-soft: #3d2222;
  --partial: #e3b04f; --partial-soft: #3a2f17; --flag: #e08ccc; --flag-soft: #3a2236;
  --k-soc: #3987e5; --k-theory: #d95926; --k-concept: #199e70;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.65 "Noto Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  word-break: keep-all; overflow-wrap: anywhere;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
h1, h2, h3 { line-height: 1.3; margin: 0 0 .5em; }
h1 { font-size: 1.5rem; } h2 { font-size: 1.15rem; } h3 { font-size: 1rem; }
p { margin: .4em 0; }
pre { margin: 0; white-space: pre-wrap; font: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.skip { position: absolute; left: -999px; top: 0; background: var(--surface); padding: 8px 12px; z-index: 999; }
.skip:focus { left: 8px; }

/* ---------- 상단 ---------- */
.topbar { position: sticky; top: 0; z-index: 50; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.brand-row { display: flex; align-items: center; gap: 12px; padding: 10px 16px 4px; max-width: 1180px; margin: 0 auto; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--ink); text-decoration: none; }
.brand-mark { width: 28px; height: 28px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 15px; }
.scope-chip { margin-left: auto; font-size: 13px; color: var(--ink-2); background: var(--surface); border: 1px solid var(--line); padding: 3px 10px; border-radius: 999px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60vw; }
.scope-chip.warn { color: var(--partial); border-color: var(--partial); }
.nav { display: flex; gap: 4px; overflow-x: auto; padding: 6px 12px 8px; max-width: 1180px; margin: 0 auto; scrollbar-width: thin; }
.nav-item { flex: none; display: flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; color: var(--ink-2); text-decoration: none; font-size: 14.5px; white-space: nowrap; }
.nav-item:hover { background: var(--surface-2); }
.nav-item.active { background: var(--accent); color: var(--accent-ink); font-weight: 500; }
.nav-ico { font-size: 15px; }

main { max-width: 980px; margin: 0 auto; padding: 20px 16px 120px; outline: none; }
.page-head { margin: 6px 0 18px; }
.page-head p { max-width: 70ch; }

/* ---------- 공통 ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; margin: 14px 0; box-shadow: var(--shadow); }
.card.center { text-align: center; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.grow { flex: 1; }
.row { display: flex; gap: 8px; align-items: center; margin: 10px 0; }
.row.wrap { flex-wrap: wrap; }
.row.end { justify-content: flex-end; }
.row.center { justify-content: center; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 14px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; align-items: end; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; text-decoration: none; font-size: 15px; min-height: 40px; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 500; }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--wrong); }
.btn.small { padding: 5px 11px; min-height: 32px; font-size: 13.5px; }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn[data-busy]::after { content: ""; width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
.icon-btn { border: 0; background: transparent; cursor: pointer; padding: 6px 8px; border-radius: 8px; color: var(--ink-2); font-size: 15px; min-width: 34px; min-height: 34px; }
.icon-btn:hover:not(:disabled) { background: var(--surface-2); }
.icon-btn:disabled { opacity: .3; }
.linklike { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; text-decoration: underline; }
.input { width: 100%; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); min-height: 40px; }
textarea.input { resize: vertical; line-height: 1.6; }
.input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.input.right { border-color: var(--right); background: var(--right-soft); }
.input.wrong { border-color: var(--wrong); background: var(--wrong-soft); }
select.input, select { padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); min-height: 40px; }
.field { display: flex; flex-direction: column; gap: 6px; margin: 8px 0; }
.field-label { font-size: 13.5px; font-weight: 500; color: var(--ink-2); }
.hint { font-size: 12.5px; color: var(--muted); }
.check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; margin: 8px 0; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }
.seg { display: inline-flex; flex-wrap: wrap; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 8px; cursor: pointer; color: var(--ink-2); font-size: 14px; min-height: 34px; }
.seg button.on { background: var(--surface); color: var(--ink); font-weight: 500; box-shadow: var(--shadow); }
.chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); }
.chip.toggle { cursor: pointer; }
.chip.toggle.on { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
.chip.toggle.some { border-style: dashed; border-color: var(--accent); }
.tag { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--accent-soft); color: var(--ink); }
.tag.soft { background: var(--surface-2); color: var(--ink-2); }
.tag.ghost { background: transparent; border: 1px solid var(--line); color: var(--muted); }
.tag.external { background: var(--partial-soft); color: var(--partial); font-weight: 500; }
.tag.label-material { background: var(--accent-soft); }
.tag.label-verified { background: var(--right-soft); color: var(--right); }
.tag.label-unverified { background: var(--partial-soft); color: var(--partial); }
.tag.warn-tag { background: var(--partial-soft); color: var(--partial); }
.notice { background: var(--accent-soft); border-radius: 10px; padding: 12px 14px; margin: 12px 0; }
.notice.warn { background: var(--partial-soft); }
.notice.error { background: var(--wrong-soft); color: var(--ink); }
.empty { padding: 20px 0; text-align: center; }
.empty-state { text-align: center; padding: 60px 16px; }
.loading { display: flex; align-items: center; gap: 12px; padding: 22px; color: var(--ink-2); justify-content: center; }
.spinner { width: 20px; height: 20px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 14px 0; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: flex; flex-direction: column; }
.stat-v { font-size: 1.4rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat-l { font-size: 13px; color: var(--muted); }
.table-wrap { overflow-x: auto; }
.data-table, .rubric-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.data-table th, .data-table td, .rubric-table th, .rubric-table td { border-bottom: 1px solid var(--line); padding: 7px 8px; text-align: left; vertical-align: top; }
.num { text-align: right !important; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* 출처 */
.sources { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 10px; font-size: 13px; }
.sources.none { color: var(--muted); }
.src-label { font-weight: 500; color: var(--ink-2); }
.chip.src { background: var(--surface-2); border-color: transparent; color: var(--ink); text-decoration: none; }
.chip.src.bad { background: var(--partial-soft); color: var(--partial); }
.chip.src.inline { font-size: 12px; padding: 1px 7px; margin: 0 2px; vertical-align: 1px; }

/* 토스트 · 모달 */
#toasts { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 300; display: flex; flex-direction: column; gap: 8px; width: min(92vw, 440px); }
.toast { background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 10px; font-size: 14px; box-shadow: var(--shadow); transition: opacity .3s; }
.toast.error { background: var(--wrong); color: #fff; }
.toast.warn { background: var(--partial); color: #fff; }
.toast.out { opacity: 0; }
.modal-back { position: fixed; inset: 0; background: rgba(10, 10, 20, .45); z-index: 200; display: grid; place-items: center; padding: 16px; }
.modal { background: var(--surface); border-radius: var(--radius); width: min(100%, 460px); max-height: 90vh; overflow: auto; box-shadow: 0 10px 40px rgba(0,0,0,.25); }
.modal-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 0; }
.modal-head h3 { margin: 0; }
.modal-body { padding: 8px 16px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 16px 16px; }

/* ---------- 자료·범위 ---------- */
.dropzone { border: 2px dashed var(--line); border-radius: var(--radius); background: var(--surface); padding: 30px 16px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; cursor: pointer; }
.dropzone:hover, .dropzone.over { border-color: var(--accent); background: var(--accent-soft); }
.drop-ico { font-size: 26px; color: var(--accent); }
.up-row { display: flex; align-items: center; gap: 10px; font-size: 14px; margin: 6px 0; }
.bar { flex: 1; height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
.doc-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin: 12px 0; }
.doc-head { display: flex; align-items: center; gap: 10px; }
.doc-title { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.doc-kind { font-size: 11px; font-weight: 700; padding: 4px 6px; border-radius: 6px; color: #fff; background: #c4452a; }
.doc-kind.pptx { background: #c4762a; }
.doc-card .row .input { width: 210px; max-width: 100%; }
.chapters { margin: 8px 0; }
.unit-details summary { cursor: pointer; font-size: 14px; color: var(--ink-2); padding: 6px 0; }
.unit-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(42px, 1fr)); gap: 4px; margin-top: 6px; }
.unit { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 5px 0; font-size: 12.5px; cursor: pointer; font-variant-numeric: tabular-nums; }
.unit.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.unit.empty { opacity: .35; cursor: not-allowed; text-decoration: line-through; }

/* ---------- 문제 카드 ---------- */
.settings-card .field { margin: 0; }
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; margin: 14px 0; box-shadow: var(--shadow); scroll-margin-top: calc(var(--top-h) + 60px); }
.qmeta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; }
.qnum { font-weight: 700; color: var(--accent); margin-right: 2px; }
.qstem { font-weight: 500; font-size: 1.04rem; white-space: pre-line; margin: 8px 0 12px; }
.qcontext { background: var(--surface-2); border-radius: 10px; padding: 12px 14px; margin: 8px 0; white-space: pre-line; }
.ctx-label { display: inline-block; font-size: 12px; font-weight: 700; color: var(--accent); margin-right: 8px; }
.options { display: flex; flex-direction: column; gap: 6px; }
.opt { display: flex; gap: 8px; align-items: flex-start; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; }
.opt:hover { border-color: var(--accent); }
.opt input { margin-top: 6px; accent-color: var(--accent); }
.opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.opt.right { border-color: var(--right); background: var(--right-soft); }
.opt.wrong { border-color: var(--wrong); background: var(--wrong-soft); }
.circ { font-weight: 500; color: var(--ink-2); }
.bogi { border: 1px solid var(--ink-2); border-radius: 6px; padding: 14px 14px 8px; margin: 4px 0 12px; position: relative; }
.bogi-title { position: absolute; top: -11px; left: 50%; transform: translateX(-50%); background: var(--surface); padding: 0 8px; font-size: 14px; }
.ox-row { display: flex; gap: 12px; }
.ox-btn { width: 84px; height: 64px; font-size: 26px; font-weight: 700; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); cursor: pointer; }
.ox-btn[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.ox-btn.right { border-color: var(--right); background: var(--right-soft); }
.ox-btn.wrong { border-color: var(--wrong); background: var(--wrong-soft); }
.blank-mark { display: inline-block; color: var(--accent); font-weight: 700; padding: 0 3px; }
.blank-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; }
.blank-field { display: flex; align-items: center; gap: 6px; }
.match-table { display: flex; flex-direction: column; gap: 6px; }
.match-row { display: grid; grid-template-columns: 1fr 1.3fr 1.3fr; gap: 6px; align-items: center; }
.match-row.head { font-size: 13px; color: var(--muted); }
.match-row .who { font-weight: 500; }
.order-list { padding: 0; margin: 0; list-style: none; counter-reset: ord; display: flex; flex-direction: column; gap: 6px; }
.order-list li { counter-increment: ord; display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px 6px 12px; }
.order-list li::before { content: counter(ord); font-weight: 700; color: var(--accent); width: 18px; }
.order-list li.right { border-color: var(--right); background: var(--right-soft); }
.order-list li.wrong { border-color: var(--wrong); background: var(--wrong-soft); }
.order-text { flex: 1; }
.order-btns { display: flex; }
.cmp-table { width: 100%; border-collapse: collapse; min-width: 480px; }
.cmp-table th, .cmp-table td { border: 1px solid var(--line); padding: 8px; vertical-align: top; font-size: 14.5px; }
.cmp-table thead th { background: var(--surface-2); }
.cmp-table tbody th { background: var(--surface-2); text-align: left; font-weight: 500; width: 22%; }
.blank-cell { background: var(--accent-soft); }
.rubric-hint { margin-bottom: 8px; font-size: 14px; color: var(--ink-2); }
.qactions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.result { border-radius: 10px; padding: 14px; margin-top: 12px; border-left: 4px solid var(--line); background: var(--surface-2); }
.result.right { border-left-color: var(--right); background: var(--right-soft); }
.result.wrong { border-left-color: var(--wrong); background: var(--wrong-soft); }
.result.partial { border-left-color: var(--partial); background: var(--partial-soft); }
.result-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: baseline; margin-bottom: 6px; }
.result.right .result-head strong { color: var(--right); }
.result.wrong .result-head strong { color: var(--wrong); }
.result.partial .result-head strong { color: var(--partial); }
.score { font-weight: 700; font-variant-numeric: tabular-nums; }
.kv { display: grid; grid-template-columns: 72px 1fr; gap: 8px; margin: 4px 0; font-size: 14.5px; }
.kv > span { color: var(--muted); }
.feedback, .explain { margin: 8px 0; font-size: 14.5px; }
.feedback ul, .explain ul { margin: 4px 0; padding-left: 20px; }
.score-bar { position: sticky; top: calc(var(--top-h) + 4px); z-index: 5; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; display: inline-block; font-size: 14px; box-shadow: var(--shadow); font-variant-numeric: tabular-nums; }
.score-bar.final { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

/* ---------- 비판적 읽기 ---------- */
.passage-grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 14px; }
.passage-grid .card { margin: 0; }
.reading { font-size: 1.05rem; line-height: 1.9; white-space: pre-line; }
.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 10px 0; }
.compare > div { background: var(--surface); border-radius: 10px; padding: 12px; border: 1px solid var(--line); }
mark.chg { border-radius: 4px; padding: 1px 3px; color: var(--ink); }
mark.chg.found { background: var(--right-soft); box-shadow: inset 0 -2px 0 var(--right); }
mark.chg.located { background: var(--partial-soft); box-shadow: inset 0 -2px 0 var(--partial); }
mark.chg.missed { background: var(--wrong-soft); box-shadow: inset 0 -2px 0 var(--wrong); }
mark.chg.flag { background: var(--flag-soft); box-shadow: inset 0 -2px 0 var(--flag); }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 13px; }
.change-list { padding-left: 20px; }
.change-list li { margin: 4px 0; }
.change-list li.found b { color: var(--right); }
.change-list li.missed b { color: var(--wrong); }
.change-list li.located b { color: var(--partial); }
.passage-result.right { border-left: 4px solid var(--right); }
.passage-result.wrong { border-left: 4px solid var(--wrong); }

/* ---------- 발화자 ---------- */
.quote { margin: 8px 0; padding: 12px 16px; border-left: 4px solid var(--accent); background: var(--surface-2); border-radius: 0 10px 10px 0; font-size: 1.08rem; line-height: 1.8; }
.quote.q-original { font-size: .98rem; border-left-color: var(--muted); font-style: italic; }
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px; }
.choice { display: flex; gap: 8px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); cursor: pointer; text-align: left; min-height: 44px; }
.choice:hover:not(:disabled) { border-color: var(--accent); }
.choice.right { border-color: var(--right); background: var(--right-soft); }
.choice.wrong { border-color: var(--wrong); background: var(--wrong-soft); }

/* ---------- 개념 맞히기 ---------- */
.clues { padding-left: 22px; margin: 6px 0 12px; }
.clues li { margin: 5px 0; }
